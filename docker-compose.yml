version: '3.8'

services:
  vinylbuddy:
    image: potseeslc/vinylbuddy:latest
    container_name: vinylbuddy
    ports:
      - "3000:3000"
    volumes:
      - vinylbuddy_uploads:/app/uploads
    environment:
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:?Set MUSICBRAINZ_CONTACT in your environment or .env file}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SECRET: ${LASTFM_SECRET:-}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-}
      LASTFM_SESSION_KEY: ${LASTFM_SESSION_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"  # For auto-updates if using Watchtower

volumes:
  vinylbuddy_uploads:
    driver: local
